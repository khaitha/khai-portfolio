<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <style>
      .s{fill:none;stroke:#94a3b8;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .a{fill:none;stroke:#6366f1;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .af{fill:#6366f120;stroke:#6366f1;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .lbl{font:bold 9px Arial,sans-serif;fill:#475569;text-anchor:middle;letter-spacing:2}
      .hd{font:10px Arial,sans-serif;fill:#334155;text-anchor:middle;letter-spacing:4}
    </style>
  </defs>
  <rect width="800" height="500" fill="#0a0f1e"/>
  <rect width="800" height="56" fill="#0f172a"/>
  <rect y="444" width="800" height="56" fill="#0f172a"/>
  <text x="400" y="30" class="hd">ICON SET — DIGITAL INTERFACE SERIES</text>
  <text x="400" y="46" style="font:9px Arial,sans-serif;fill:#1e293b;text-anchor:middle;letter-spacing:3">VECTOR ILLUSTRATION · KHAI THA · 2024</text>
  <text x="400" y="470" class="hd">KHAI THA — VECTOR WORKS</text>
  <text x="400" y="486" style="font:8px Arial,sans-serif;fill:#1e293b;text-anchor:middle;letter-spacing:2">CREATED WITH INKSCAPE</text>
  <line x1="267" y1="56" x2="267" y2="444" stroke="#1e293b" stroke-width="1"/>
  <line x1="534" y1="56" x2="534" y2="444" stroke="#1e293b" stroke-width="1"/>
  <line x1="0" y1="250" x2="800" y2="250" stroke="#1e293b" stroke-width="1"/>

  <!-- ICON 1: PROCESSOR -->
  <g transform="translate(133,163)">
    <rect x="-28" y="-28" width="56" height="56" rx="6" class="s"/>
    <rect x="-16" y="-16" width="32" height="32" rx="3" class="a"/>
    <line x1="-28" y1="-12" x2="-40" y2="-12" class="s"/>
    <line x1="-28" y1="0" x2="-40" y2="0" class="s"/>
    <line x1="-28" y1="12" x2="-40" y2="12" class="s"/>
    <line x1="28" y1="-12" x2="40" y2="-12" class="s"/>
    <line x1="28" y1="0" x2="40" y2="0" class="s"/>
    <line x1="28" y1="12" x2="40" y2="12" class="s"/>
    <line x1="-12" y1="-28" x2="-12" y2="-40" class="s"/>
    <line x1="0" y1="-28" x2="0" y2="-40" class="s"/>
    <line x1="12" y1="-28" x2="12" y2="-40" class="s"/>
    <line x1="-12" y1="28" x2="-12" y2="40" class="s"/>
    <line x1="0" y1="28" x2="0" y2="40" class="s"/>
    <line x1="12" y1="28" x2="12" y2="40" class="s"/>
    <text y="74" class="lbl">PROCESSOR</text>
  </g>

  <!-- ICON 2: LAYERS -->
  <g transform="translate(400,163)">
    <rect x="-28" y="18" width="56" height="12" rx="3" class="s"/>
    <rect x="-24" y="4" width="48" height="12" rx="3" class="s"/>
    <rect x="-20" y="-10" width="40" height="12" rx="3" class="s"/>
    <rect x="-16" y="-24" width="32" height="12" rx="3" class="a" fill="#6366f115"/>
    <circle cx="0" cy="-18" r="3" fill="#6366f1"/>
    <text y="74" class="lbl">LAYERS</text>
  </g>

  <!-- ICON 3: VECTOR PATH -->
  <g transform="translate(667,163)">
    <path d="M -30,26 C -30,-26 30,-26 30,26" class="a"/>
    <line x1="-30" y1="26" x2="-30" y2="-26" class="s" stroke-dasharray="3 3"/>
    <line x1="30" y1="26" x2="30" y2="-26" class="s" stroke-dasharray="3 3"/>
    <rect x="-33" y="22" width="7" height="7" rx="1" class="s" fill="#0a0f1e"/>
    <rect x="26" y="22" width="7" height="7" rx="1" class="s" fill="#0a0f1e"/>
    <circle cx="-30" cy="-26" r="4" fill="#6366f1"/>
    <circle cx="30" cy="-26" r="4" fill="#6366f1"/>
    <text y="74" class="lbl">VECTOR PATH</text>
  </g>

  <!-- ICON 4: COLOUR PALETTE -->
  <g transform="translate(133,347)">
    <circle cx="0" cy="0" r="30" class="s"/>
    <circle cx="0" cy="0" r="11" fill="#0a0f1e" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="0" cy="-21" r="6" fill="#6366f1"/>
    <circle cx="18" cy="-11" r="6" fill="#06b6d4"/>
    <circle cx="18" cy="11" r="6" fill="#10b981"/>
    <circle cx="0" cy="21" r="6" fill="#f59e0b"/>
    <circle cx="-18" cy="11" r="6" fill="#ef4444"/>
    <circle cx="-18" cy="-11" r="6" fill="#ec4899"/>
    <text y="60" class="lbl">COLOUR PALETTE</text>
  </g>

  <!-- ICON 5: GRID LAYOUT -->
  <g transform="translate(400,347)">
    <rect x="-28" y="-28" width="16" height="16" rx="2" class="s"/>
    <rect x="-7" y="-28" width="16" height="16" rx="2" class="s"/>
    <rect x="14" y="-28" width="16" height="16" rx="2" class="af"/>
    <rect x="-28" y="-7" width="16" height="16" rx="2" class="s"/>
    <rect x="-7" y="-7" width="16" height="16" rx="2" class="af"/>
    <rect x="14" y="-7" width="16" height="16" rx="2" class="s"/>
    <rect x="-28" y="14" width="16" height="16" rx="2" class="af"/>
    <rect x="-7" y="14" width="16" height="16" rx="2" class="s"/>
    <rect x="14" y="14" width="16" height="16" rx="2" class="s"/>
    <text y="60" class="lbl">GRID LAYOUT</text>
  </g>

  <!-- ICON 6: STAR / EMBLEM -->
  <g transform="translate(667,347)">
    <path d="M 0,-32 L 6,-6 L 32,0 L 6,6 L 0,32 L -6,6 L -32,0 L -6,-6 Z" class="af"/>
    <path d="M 22,-22 L 24,-20 L 26,-22 L 24,-24 Z" fill="#94a3b8"/>
    <path d="M -24,18 L -22,20 L -20,18 L -22,16 Z" fill="#64748b"/>
    <path d="M 18,22 L 20,24 L 22,22 L 20,20 Z" fill="#64748b"/>
    <text y="60" class="lbl">STAR / EMBLEM</text>
  </g>
</svg>
