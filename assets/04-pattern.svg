<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <!-- Tile: 100x100 botanical motif -->
    <pattern id="tile" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Stem -->
      <line x1="50" y1="95" x2="50" y2="10" stroke="#4a8a68" stroke-width="2" stroke-linecap="round"/>
      <!-- Left leaf pair (lower) -->
      <ellipse cx="34" cy="72" rx="10" ry="20" fill="#3a7858" transform="rotate(-38,34,72)"/>
      <ellipse cx="66" cy="72" rx="10" ry="20" fill="#4a8868" transform="rotate(38,66,72)"/>
      <!-- Left leaf pair (upper) -->
      <ellipse cx="36" cy="46" rx="9" ry="17" fill="#4a9068" transform="rotate(-30,36,46)"/>
      <ellipse cx="64" cy="46" rx="9" ry="17" fill="#3a8060" transform="rotate(30,64,46)"/>
      <!-- Top bud/flower -->
      <circle cx="50" cy="18" r="7" fill="#c8a860"/>
      <circle cx="50" cy="10" r="4" fill="#d8b870"/>
      <!-- Small accent dots -->
      <circle cx="28" cy="58" r="2.5" fill="#5aaa7a" fill-opacity="0.6"/>
      <circle cx="72" cy="58" r="2.5" fill="#5aaa7a" fill-opacity="0.6"/>
      <!-- Diamond separator -->
      <path d="M 50,96 L 53,100 L 50,104 L 47,100 Z" fill="#c8a860" fill-opacity="0.5"/>
    </pattern>

    <!-- Offset tile for alternating rows -->
    <pattern id="tile2" x="50" y="50" width="100" height="100" patternUnits="userSpaceOnUse">
      <line x1="50" y1="95" x2="50" y2="10" stroke="#3e7860" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="34" cy="72" rx="10" ry="20" fill="#4a8868" transform="rotate(-38,34,72)"/>
      <ellipse cx="66" cy="72" rx="10" ry="20" fill="#3a7858" transform="rotate(38,66,72)"/>
      <ellipse cx="36" cy="46" rx="9" ry="17" fill="#3a8060" transform="rotate(-30,36,46)"/>
      <ellipse cx="64" cy="46" rx="9" ry="17" fill="#4a9068" transform="rotate(30,64,46)"/>
      <circle cx="50" cy="18" r="7" fill="#b89850"/>
      <circle cx="50" cy="10" r="4" fill="#c8a860"/>
      <circle cx="28" cy="58" r="2.5" fill="#5aaa7a" fill-opacity="0.6"/>
      <circle cx="72" cy="58" r="2.5" fill="#5aaa7a" fill-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#0a2a22"/>

  <!-- Pattern fill -->
  <rect width="800" height="500" fill="url(#tile)"/>
  <rect width="800" height="500" fill="url(#tile2)" fill-opacity="0.5"/>

  <!-- Vignette overlay (darkens edges) -->
  <radialGradient id="vign" cx="50%" cy="50%" r="60%">
    <stop offset="0%" stop-color="transparent"/>
    <stop offset="100%" stop-color="#061612" stop-opacity="0.7"/>
  </radialGradient>
  <rect width="800" height="500" fill="url(#vign)"/>

  <!-- Title overlay (center label) -->
  <rect x="270" y="210" width="260" height="80" rx="4" fill="#0a2a22" fill-opacity="0.8"/>
  <text x="400" y="242" font-family="Georgia,serif" font-size="13" fill="#c8a860" text-anchor="middle" letter-spacing="5" font-style="italic">Botanical</text>
  <text x="400" y="262" font-family="Arial" font-size="9" fill="#4a8868" text-anchor="middle" letter-spacing="6">PATTERN STUDY No. 4</text>
  <line x1="304" y1="270" x2="496" y2="270" stroke="#4a8868" stroke-width="0.8" stroke-opacity="0.6"/>
  <text x="400" y="282" font-family="Arial" font-size="7" fill="#2e5844" text-anchor="middle" letter-spacing="3">KHAI THA · 2024</text>

  <!-- Caption -->
  <text x="32"  y="492" font-family="Georgia,serif" font-size="9" fill="#1e4432" font-style="italic" letter-spacing="2">Botanical Pattern Study — Surface Design</text>
  <text x="768" y="492" font-family="Georgia,serif" font-size="9" fill="#1e4432" text-anchor="end" font-style="italic" letter-spacing="1">Khai Tha, 2024</text>
</svg>
