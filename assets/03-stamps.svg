<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <!-- Text paths for curved stamp text -->
    <path id="tp1" d="M 196,92 A 74,74 0 1,1 195.99,92"/>
    <path id="tp2" d="M 604,92 A 74,74 0 1,1 603.99,92"/>
    <path id="tp3" d="M 196,292 A 74,74 0 1,1 195.99,292"/>
    <path id="tp4" d="M 604,292 A 74,74 0 1,1 603.99,292"/>
  </defs>

  <!-- Parchment background -->
  <rect width="800" height="500" fill="#f2e8d4"/>
  <!-- Paper grain lines -->
  <line x1="0" y1="100" x2="800" y2="100" stroke="#e4d6bc" stroke-width="0.5"/>
  <line x1="0" y1="200" x2="800" y2="200" stroke="#e4d6bc" stroke-width="0.5"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#e4d6bc" stroke-width="0.5"/>
  <line x1="0" y1="400" x2="800" y2="400" stroke="#e4d6bc" stroke-width="0.5"/>

  <!-- CENTER DIVIDERS -->
  <line x1="400" y1="0" x2="400" y2="500" stroke="#e0d0b8" stroke-width="1"/>
  <line x1="0" y1="250" x2="800" y2="250" stroke="#e0d0b8" stroke-width="1"/>

  <!-- ==================== STAMP 1: MOUNTAIN (196, 166) ==================== -->
  <!-- Perforated outer edge -->
  <circle cx="196" cy="166" r="82" fill="none" stroke="#1a2a4a" stroke-width="1.5" stroke-dasharray="4 3.5"/>
  <!-- Stamp body -->
  <circle cx="196" cy="166" r="72" fill="#1a2a4a"/>
  <!-- Inner design circle -->
  <circle cx="196" cy="166" r="58" fill="none" stroke="#c8b87a" stroke-width="1"/>
  <!-- Mountain silhouette -->
  <polygon points="136,192 162,148 182,168 196,138 212,165 230,152 256,192" fill="none" stroke="#c8b87a" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="136,192 162,148 182,168 196,138 212,165 230,152 256,192" fill="#c8b87a" fill-opacity="0.12"/>
  <!-- Moon/sun -->
  <circle cx="196" cy="154" r="12" fill="none" stroke="#c8b87a" stroke-width="1.2"/>
  <!-- Ground line -->
  <line x1="138" y1="192" x2="254" y2="192" stroke="#c8b87a" stroke-width="1"/>
  <!-- Curved text -->
  <text font-family="Arial" font-size="9" fill="#c8b87a" letter-spacing="4">
    <textPath href="#tp1" startOffset="8%">· MOUNTAIN SERIES · VECTOR ·</textPath>
  </text>

  <!-- ==================== STAMP 2: BOTANICAL LEAF (604, 166) ==================== -->
  <circle cx="604" cy="166" r="82" fill="none" stroke="#1e4a2a" stroke-width="1.5" stroke-dasharray="4 3.5"/>
  <circle cx="604" cy="166" r="72" fill="#1e4a2a"/>
  <circle cx="604" cy="166" r="58" fill="none" stroke="#a8c87a" stroke-width="1"/>
  <!-- Large leaf -->
  <path d="M 604,200 C 580,185 564,162 568,140 C 572,120 592,114 604,124 C 616,114 636,120 640,140 C 644,162 628,185 604,200 Z" fill="none" stroke="#a8c87a" stroke-width="1.5"/>
  <path d="M 604,200 C 600,178 598,155 598,138" stroke="#a8c87a" stroke-width="1" fill="none"/>
  <!-- Small leaf left -->
  <path d="M 584,158 C 568,150 560,136 566,126 C 570,119 580,120 584,130 C 586,138 586,149 584,158 Z" fill="none" stroke="#a8c87a" stroke-width="1.2"/>
  <!-- Small leaf right -->
  <path d="M 624,158 C 640,150 648,136 642,126 C 638,119 628,120 624,130 C 622,138 622,149 624,158 Z" fill="none" stroke="#a8c87a" stroke-width="1.2"/>
  <!-- Berries/dots -->
  <circle cx="596" cy="210" r="4" fill="#a8c87a"/>
  <circle cx="604" cy="214" r="4" fill="#a8c87a"/>
  <circle cx="612" cy="210" r="4" fill="#a8c87a"/>
  <text font-family="Arial" font-size="9" fill="#a8c87a" letter-spacing="4">
    <textPath href="#tp2" startOffset="8%">· BOTANICAL · STUDIO SERIES ·</textPath>
  </text>

  <!-- ==================== STAMP 3: WAVE (196, 366) ==================== -->
  <circle cx="196" cy="366" r="82" fill="none" stroke="#4a1a1a" stroke-width="1.5" stroke-dasharray="4 3.5"/>
  <circle cx="196" cy="366" r="72" fill="#4a1a1a"/>
  <circle cx="196" cy="366" r="58" fill="none" stroke="#e8a87a" stroke-width="1"/>
  <!-- Wave lines -->
  <path d="M 144,354 C 154,348 162,348 172,354 C 182,360 192,360 202,354 C 212,348 222,348 232,354 C 242,360 248,360 252,354" fill="none" stroke="#e8a87a" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 144,366 C 154,360 162,360 172,366 C 182,372 192,372 202,366 C 212,360 222,360 232,366 C 242,372 248,372 252,366" fill="none" stroke="#e8a87a" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 144,378 C 154,372 162,372 172,378 C 182,384 192,384 202,378 C 212,372 222,372 232,378 C 242,384 248,384 252,378" fill="none" stroke="#e8a87a" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Sun above waves -->
  <circle cx="196" cy="335" r="13" fill="none" stroke="#e8a87a" stroke-width="1.2"/>
  <!-- Sun rays -->
  <line x1="196" y1="318" x2="196" y2="312" stroke="#e8a87a" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="207" y1="321" x2="211" y2="316" stroke="#e8a87a" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="185" y1="321" x2="181" y2="316" stroke="#e8a87a" stroke-width="1.2" stroke-linecap="round"/>
  <text font-family="Arial" font-size="9" fill="#e8a87a" letter-spacing="4">
    <textPath href="#tp3" startOffset="8%">· COASTAL STUDY · 2024 ·</textPath>
  </text>

  <!-- ==================== STAMP 4: COMPASS STAR (604, 366) ==================== -->
  <circle cx="604" cy="366" r="82" fill="none" stroke="#2a3a1a" stroke-width="1.5" stroke-dasharray="4 3.5"/>
  <circle cx="604" cy="366" r="72" fill="#2a3a1a"/>
  <circle cx="604" cy="366" r="58" fill="none" stroke="#c8d87a" stroke-width="1"/>
  <!-- 8-point compass star -->
  <path d="M 604,322 L 610,356 L 648,366 L 610,376 L 604,410 L 598,376 L 560,366 L 598,356 Z" fill="none" stroke="#c8d87a" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Inner diamond -->
  <path d="M 604,346 L 610,362 L 604,378 L 598,362 Z" fill="#c8d87a" fill-opacity="0.25" stroke="#c8d87a" stroke-width="1"/>
  <!-- N/S/E/W labels -->
  <text x="604" y="320" font-family="Arial" font-size="8" fill="#c8d87a" text-anchor="middle" font-weight="bold">N</text>
  <text x="604" y="416" font-family="Arial" font-size="8" fill="#c8d87a" text-anchor="middle" font-weight="bold">S</text>
  <text x="652" y="369" font-family="Arial" font-size="8" fill="#c8d87a" text-anchor="middle" font-weight="bold">E</text>
  <text x="556" y="369" font-family="Arial" font-size="8" fill="#c8d87a" text-anchor="middle" font-weight="bold">W</text>
  <!-- Center circle -->
  <circle cx="604" cy="366" r="6" fill="#c8d87a" fill-opacity="0.4" stroke="#c8d87a" stroke-width="1"/>
  <text font-family="Arial" font-size="9" fill="#c8d87a" letter-spacing="4">
    <textPath href="#tp4" startOffset="8%">· COMPASS ROSE · NORTH STUDIO ·</textPath>
  </text>

  <!-- Caption -->
  <text x="36"  y="486" font-family="Georgia,serif" font-size="9" fill="#6a5838" font-style="italic" letter-spacing="2">Heritage Badge Series — Vector Design</text>
  <text x="764" y="486" font-family="Georgia,serif" font-size="9" fill="#6a5838" text-anchor="end" font-style="italic" letter-spacing="1">Khai Tha, 2024</text>
</svg>
