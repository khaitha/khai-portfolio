<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 780" width="560" height="780">
  <defs>
    <linearGradient id="gv" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="gt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="560" height="780" fill="#0a0f1e"/>

  <!-- Large backdrop circle -->
  <circle cx="280" cy="410" r="255" fill="url(#gt)" stroke="#06b6d4" stroke-width="1"/>
  <circle cx="280" cy="410" r="195" fill="none" stroke="#6366f1" stroke-width="0.7" stroke-dasharray="8 8" stroke-opacity="0.4"/>
  <circle cx="280" cy="410" r="130" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Cross hairs (construction) -->
  <line x1="280" y1="155" x2="280" y2="665" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="25" y1="410" x2="535" y2="410" stroke="#1e293b" stroke-width="0.5"/>

  <!-- Header area -->
  <line x1="40" y1="80" x2="520" y2="80" stroke="#1e293b" stroke-width="1"/>
  <text x="280" y="55" font-family="Arial" font-size="11" font-weight="bold" fill="#e2e8f0" text-anchor="middle" letter-spacing="10">KHAI THA</text>
  <text x="280" y="72" font-family="Arial" font-size="8" fill="#475569" text-anchor="middle" letter-spacing="5">CREATIVE STUDIO</text>

  <!-- Series label -->
  <text x="40" y="104" font-family="Arial" font-size="8" fill="#334155" letter-spacing="3">SERIES 01</text>
  <text x="520" y="104" font-family="Arial" font-size="8" fill="#334155" text-anchor="end" letter-spacing="3">VECTOR DESIGN</text>

  <!-- Main typography -->
  <text x="280" y="310" font-family="Arial" font-size="82" font-weight="bold" fill="url(#gv)" text-anchor="middle" letter-spacing="6">VECTOR</text>
  <text x="280" y="400" font-family="Arial" font-size="62" font-weight="bold" fill="#e2e8f0" text-anchor="middle" letter-spacing="4" fill-opacity="0.92">DESIGN</text>
  <text x="280" y="468" font-family="Arial" font-size="40" fill="#94a3b8" text-anchor="middle" letter-spacing="20">STUDIO</text>

  <!-- Decorative horizontal rule -->
  <line x1="80" y1="496" x2="480" y2="496" stroke="#1e293b" stroke-width="1"/>
  <circle cx="280" cy="496" r="3" fill="#6366f1"/>

  <!-- Subtitle text -->
  <text x="280" y="524" font-family="Arial" font-size="10" fill="#334155" text-anchor="middle" letter-spacing="4">SCALABLE · PRECISE · EXPRESSIVE</text>

  <!-- Decorative dots row -->
  <circle cx="200" cy="560" r="3" fill="#6366f1" fill-opacity="0.5"/>
  <circle cx="220" cy="560" r="3" fill="#6366f1" fill-opacity="0.7"/>
  <circle cx="240" cy="560" r="3" fill="#06b6d4" fill-opacity="0.9"/>
  <circle cx="260" cy="560" r="3" fill="#06b6d4"/>
  <circle cx="280" cy="560" r="4" fill="#06b6d4"/>
  <circle cx="300" cy="560" r="3" fill="#06b6d4"/>
  <circle cx="320" cy="560" r="3" fill="#6366f1" fill-opacity="0.9"/>
  <circle cx="340" cy="560" r="3" fill="#6366f1" fill-opacity="0.7"/>
  <circle cx="360" cy="560" r="3" fill="#6366f1" fill-opacity="0.5"/>

