  <line x1="40" y1="600" x2="40" y2="640" stroke="#1e293b" stroke-width="1"/>
  <line x1="40" y1="640" x2="80" y2="640" stroke="#1e293b" stroke-width="1"/>
  <line x1="520" y1="600" x2="520" y2="640" stroke="#1e293b" stroke-width="1"/>
