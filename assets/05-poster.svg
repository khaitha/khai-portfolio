  <line x1="40" y1="700" x2="520" y2="700" stroke="#1e293b" stroke-width="1"/>
  <text x="280" y="724" font-family="Arial" font-size="9" fill="#334155" text-anchor="middle" letter-spacing="4">KHAI THA · INKSCAPE · 2024</text>
  <text x="280" y="744" font-family="Arial" font-size="8" fill="#1e293b" text-anchor="middle" letter-spacing="3">DIGITAL MEDIA SPECIALIST</text>
