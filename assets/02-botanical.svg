<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">

  <rect width="800" height="500" fill="#fdf5e4"/>
  <!-- Faint ruled lines (paper texture) -->
  <line x1="0" y1="125" x2="800" y2="125" stroke="#ede0c8" stroke-width="0.6"/>
  <line x1="0" y1="250" x2="800" y2="250" stroke="#ede0c8" stroke-width="0.6"/>
  <line x1="0" y1="375" x2="800" y2="375" stroke="#ede0c8" stroke-width="0.6"/>

  <!-- Shelf -->
  <rect x="0" y="392" width="800" height="4" fill="#c9b08a"/>
  <rect x="0" y="396" width="800" height="104" fill="#e8d4b0"/>

  <!-- SUCCULENT POT (left-center) -->
  <!-- Shadow -->
  <ellipse cx="310" cy="400" rx="60" ry="9" fill="#b09070" fill-opacity="0.35"/>
  <!-- Pot body (trapezoid) -->
  <path d="M 262,392 L 250,468 C 248,478 253,486 263,488 C 278,491 342,491 357,488 C 367,486 372,478 370,468 L 358,392 Z" fill="#c8673c"/>
  <path d="M 272,392 L 262,455" stroke="#e07848" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Pot rim -->
  <rect x="254" y="385" width="112" height="13" rx="6" fill="#b05a2c"/>
  <rect x="256" y="385" width="108" height="8" rx="5" fill="#cc6e3e"/>
  <!-- Soil -->
  <ellipse cx="310" cy="392" rx="52" ry="9" fill="#3e2a1a"/>

  <!-- Succulent rosette — outer 6 petals -->
  <ellipse cx="310" cy="338" rx="20" ry="48" fill="#3a7a50" transform="rotate(0,310,338)"/>
  <ellipse cx="352" cy="362" rx="20" ry="48" fill="#2e6840" transform="rotate(60,352,362)"/>
  <ellipse cx="352" cy="412" rx="20" ry="48" fill="#3a7a50" transform="rotate(120,352,412)"/>
  <ellipse cx="310" cy="436" rx="20" ry="48" fill="#2e6840" transform="rotate(180,310,436)"/>
  <ellipse cx="268" cy="412" rx="20" ry="48" fill="#3a7a50" transform="rotate(240,268,412)"/>
  <ellipse cx="268" cy="362" rx="20" ry="48" fill="#2e6840" transform="rotate(300,268,362)"/>

  <!-- Succulent inner 6 petals -->
  <ellipse cx="310" cy="353" rx="14" ry="35" fill="#5aaa72" transform="rotate(30,310,353)"/>
  <ellipse cx="338" cy="368" rx="14" ry="35" fill="#4e9864" transform="rotate(90,338,368)"/>
  <ellipse cx="338" cy="396" rx="14" ry="35" fill="#5aaa72" transform="rotate(150,338,396)"/>
  <ellipse cx="310" cy="411" rx="14" ry="35" fill="#4e9864" transform="rotate(210,310,411)"/>
  <ellipse cx="282" cy="396" rx="14" ry="35" fill="#5aaa72" transform="rotate(270,282,396)"/>
  <ellipse cx="282" cy="368" rx="14" ry="35" fill="#4e9864" transform="rotate(330,282,368)"/>

  <!-- Center -->
  <circle cx="310" cy="387" r="20" fill="#7ec492"/>
  <circle cx="310" cy="387" r="12" fill="#9ad4a6"/>
  <circle cx="310" cy="387" r="6"  fill="#b8e4c0"/>

  <!-- SMALL CACTUS (right side) -->
  <!-- Shadow -->
  <ellipse cx="520" cy="400" rx="32" ry="7" fill="#b09070" fill-opacity="0.3"/>
  <!-- Pot -->
  <path d="M 494,392 L 486,464 C 485,472 489,478 496,480 C 508,482 532,482 544,480 C 551,478 555,472 554,464 L 546,392 Z" fill="#b85a28"/>
  <rect x="487" y="385" width="66" height="11" rx="5" fill="#a04e20"/>
  <rect x="489" y="385" width="62" height="7" rx="4" fill="#c46232"/>
  <ellipse cx="520" cy="392" rx="30" ry="7" fill="#3e2a1a"/>
  <!-- Cactus body (rounded rectangle) -->
  <rect x="506" y="290" width="28" height="102" rx="14" fill="#4a8a3e"/>
  <!-- Cactus arms -->
  <rect x="520" y="316" width="30" height="18" rx="9" fill="#4a8a3e"/>
  <rect x="550" y="298" width="18" height="35" rx="9" fill="#4a8a3e"/>
  <rect x="490" y="308" width="16" height="26" rx="8" fill="#4a8a3e" transform="scale(-1,1) translate(-1040,0)"/>
  <rect x="476" y="298" width="14" height="30" rx="7" fill="#4a8a3e"/>
  <!-- Cactus ridges/spines -->
  <line x1="520" y1="300" x2="520" y2="390" stroke="#3a7030" stroke-width="1.5"/>
  <line x1="514" y1="316" x2="512" y2="310" stroke="#d4c88a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="526" y1="316" x2="528" y2="310" stroke="#d4c88a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="514" y1="340" x2="512" y2="334" stroke="#d4c88a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="526" y1="340" x2="528" y2="334" stroke="#d4c88a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="514" y1="364" x2="512" y2="358" stroke="#d4c88a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="526" y1="364" x2="528" y2="358" stroke="#d4c88a" stroke-width="1.5" stroke-linecap="round"/>

  <!-- SMALL VASE (far right) -->
  <ellipse cx="660" cy="400" rx="20" ry="5" fill="#b09070" fill-opacity="0.25"/>
  <path d="M 643,392 L 638,450 C 637,458 641,462 648,463 C 658,464 662,464 672,463 C 679,462 683,458 682,450 L 677,392 Z" fill="#7a5a3c"/>
  <rect x="636" y="385" width="48" height="10" rx="5" fill="#6a4c30"/>
  <rect x="638" y="385" width="44" height="6" rx="4" fill="#8a6842"/>
  <ellipse cx="660" cy="392" rx="22" ry="6" fill="#3e2a1a"/>
  <!-- Tall stem -->
  <path d="M 660,388 C 660,360 656,332 654,305" stroke="#3d6b4f" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Leaves on stem -->
  <ellipse cx="648" cy="335" rx="10" ry="22" fill="#4a7c5a" transform="rotate(-30,648,335)"/>
  <ellipse cx="668" cy="318" rx="10" ry="22" fill="#5a8c6a" transform="rotate(25,668,318)"/>
  <ellipse cx="650" cy="300" rx="9" ry="20" fill="#4a7c5a" transform="rotate(-15,650,300)"/>

  <!-- Caption -->
  <text x="36"  y="472" font-family="Georgia,serif" font-size="10" fill="#9a7850" font-style="italic" letter-spacing="1">Studio Plant No. 3 — Botanical Illustration</text>
  <text x="764" y="472" font-family="Georgia,serif" font-size="10" fill="#9a7850" text-anchor="end" font-style="italic" letter-spacing="1">Khai Tha, 2024</text>
</svg>
